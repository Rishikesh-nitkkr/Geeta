<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sign in to Gita Mentor for Bhagavad Gita based guidance and quizzes." />
  <title>Login - Gita Mentor</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <main class="auth-page">
    <section class="auth-card" aria-labelledby="login-title">
      <div class="auth-logo">
        <span class="om-big" aria-hidden="true">ॐ</span>
        <h1 id="login-title">Gita Mentor</h1>
        <p>Wisdom from the Bhagavad Gita for modern decisions</p>
      </div>

      <div id="login-alert" class="alert" aria-live="polite"></div>

      <form id="login-form" class="stack" novalidate>
        <div class="form-group">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter your username"
            autocomplete="username"
            maxlength="50"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            maxlength="128"
            required
          />
        </div>

        <button class="btn btn-primary" id="login-btn" type="submit">Enter</button>
      </form>

      <p class="auth-switch">
        New here? <a href="register.html">Create an account</a>
      </p>
    </section>
  </main>

  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
