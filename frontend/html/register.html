<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Create your Gita Mentor account." />
  <title>Register - Gita Mentor</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <main class="auth-page">
    <section class="auth-card" aria-labelledby="register-title">
      <div class="auth-logo">
        <span class="om-big" aria-hidden="true">ॐ</span>
        <h1 id="register-title">Create Account</h1>
        <p>Begin a quiet practice of reflection and learning</p>
      </div>

      <div id="register-alert" class="alert" aria-live="polite"></div>

      <form id="register-form" class="stack" novalidate>
        <div class="form-group">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="3-50 characters"
            autocomplete="username"
            minlength="3"
            maxlength="50"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="At least 8 characters"
            autocomplete="new-password"
            minlength="8"
            maxlength="128"
            required
          />
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input
            type="password"
            id="confirm-password"
            name="confirmPassword"
            placeholder="Repeat your password"
            autocomplete="new-password"
            minlength="8"
            maxlength="128"
            required
          />
        </div>

        <button class="btn btn-primary" id="register-btn" type="submit">Begin</button>
      </form>

      <p class="auth-switch">
        Already have an account? <a href="login.html">Sign in</a>
      </p>
    </section>
  </main>

  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
