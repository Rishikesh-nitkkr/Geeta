<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Take a Bhagavad Gita quiz based on your Gita Mentor journey." />
  <title>Gita Quiz - Gita Mentor</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="page-wrapper">
    <nav class="navbar" aria-label="Primary navigation">
      <a class="navbar-brand" href="home.html" aria-label="Gita Mentor home">
        <span class="om" aria-hidden="true">ॐ</span>
        <span>Gita Mentor</span>
      </a>
      <div class="navbar-right">
        <span class="nav-username" id="nav-username"></span>
        <a class="btn-nav" href="home.html">Home</a>
        <button class="btn-nav" id="logout-btn" type="button">Logout</button>
      </div>
    </nav>

    <main class="main-content" id="main-content">
      <header class="page-header">
        <p class="eyebrow">Practice</p>
        <h1 class="section-heading">Bhagavad Gita Quiz</h1>
        <p class="section-subtext" id="quiz-subtitle">Five questions based on your mentorship journey.</p>
      </header>

      <div class="loading-spinner" id="quiz-loading" aria-live="polite">
        <div class="spinner" aria-hidden="true">
          <span class="spinner-dot"></span>
          <span class="spinner-dot"></span>
          <span class="spinner-dot"></span>
        </div>
        <p>Preparing your quiz...</p>
      </div>

      <section class="no-answer-banner" id="quiz-empty" aria-live="polite">
        <div class="banner-icon" aria-hidden="true">ॐ</div>
        <p id="quiz-empty-text"></p>
        <a href="mentor.html" class="btn btn-outline-gold">Ask First</a>
      </section>

      <section class="quiz-container" id="quiz-container" hidden aria-labelledby="question-num">
        <div class="quiz-progress">
          <div class="quiz-progress-bar" aria-hidden="true">
            <div class="quiz-progress-fill" id="progress-fill"></div>
          </div>
          <span class="quiz-progress-text" id="progress-text">1 / 5</span>
        </div>

        <div id="question-shell">
          <p class="quiz-question-num" id="question-num">Question 1</p>
          <h2 class="quiz-question-text" id="question-text"></h2>
          <div class="quiz-options" id="quiz-options"></div>
        </div>

        <div class="quiz-nav" id="quiz-nav">
          <p class="answer-feedback" id="answer-feedback" aria-live="polite"></p>
          <button class="btn btn-primary" id="next-btn" type="button" hidden>Next</button>
        </div>

        <div class="score-card" id="score-card">
          <div class="score-circle">
            <span class="score-number" id="score-number">0</span>
            <span class="score-total" id="score-total">out of 5</span>
          </div>

          <h2 class="score-message" id="score-message">Well done</h2>
          <p class="score-verse" id="score-verse"></p>

          <div class="action-row centered">
            <button class="btn btn-primary" id="retry-btn" type="button">Retry</button>
            <a href="mentor.html" class="btn btn-dark">Ask Krishna</a>
            <a href="home.html" class="btn btn-outline-gold">Home</a>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <span aria-hidden="true">ॐ</span> Bhagavad Gita Mentor
    </footer>
  </div>

  <script src="../js/utils.js"></script>
  <script src="../js/quiz.js"></script>
</body>
</html>
